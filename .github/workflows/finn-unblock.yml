name: "Finn: Unblock / Re-review"

# Thin caller stub — all logic lives in the reusable workflow in eacg-gmbh/team,
# so fixes propagate to every onboarded repo on merge (no re-onboarding). This
# file should rarely change. See ADR-016 in ARCHITECTURE.md.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write # the re-review job pushes an empty commit to retrigger Paul
  pull-requests: read # the re-review job reads PR details (head ref, body) via `gh api .../pulls/{n}`

jobs:
  agent:
    uses: eacg-gmbh/team/.github/workflows/finn-unblock-reusable.yml@main
    secrets: inherit
